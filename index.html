<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACNH Tracker</title>
<link rel="icon" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-primary:#8BC34A;--color-primary-dark:#6A9F33;
  --color-bg:#F9F6EE;--color-surface:#FFFEF9;
  --color-accent-warm:#D49B5A;--color-accent-cool:#7BC47F;
  --color-text:#5C4033;--color-text-muted:#9B8579;
  --color-collected:#6A9F33;--color-border:#E0D7C6;
  --color-danger:#E8956F;--color-shadow:rgba(0,0,0,.06);
/* System font stack only: Google Fonts (Noto Sans SC) was removed on
   purpose: the CDN is unreliable in mainland China and every target
   platform already ships a good CJK UI font. Zero network dependencies. */
  --radius-card:16px;--radius-sm:10px;--font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100vh}
button{font-family:inherit}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
button:focus-visible,.creature-item:focus-within{outline:3px solid var(--color-accent-warm);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}

.navbar{position:sticky;top:0;z-index:100;background:var(--color-primary);border-bottom:none;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;gap:8px}
.nav-left{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:1}
.nav-title{font-size:clamp(14px,2.5vw,17px);font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.5px}
.nav-tabs{display:flex;gap:2px;flex-shrink:0}
.nav-tab{padding:7px 18px;border-radius:var(--radius-sm);border:none;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-size:14px;font-weight:600;transition:background-color .2s,color .2s;white-space:nowrap}
.nav-tab:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-tab.active{background:rgba(255,255,255,.25);color:#fff}

.main{padding:20px 16px;max-width:1120px;margin:0 auto}

.progress-section{background:var(--color-surface);border-radius:var(--radius-card);padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 4px var(--color-shadow);border:1px solid var(--color-border)}
.progress-text{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress-label{font-weight:600;font-size:15px}
.progress-pct{font-size:20px;font-weight:700;color:var(--color-primary-dark)}
.progress-bar{height:10px;background:var(--color-bg);border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-dark));border-radius:8px;transition:width .4s ease}
.data-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:16px}
.storage-mode-note{margin-right:auto;max-width:660px;font-size:12px;line-height:1.5;color:var(--color-text-muted)}
.data-btn{padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);cursor:pointer;font-size:13px;transition:border-color .15s,color .15s,background-color .15s;box-shadow:0 1px 4px var(--color-shadow)}
.data-btn:hover{border-color:var(--color-primary);color:var(--color-primary-dark)}

.today-panel{background:var(--color-surface);border-radius:var(--radius-card);margin-bottom:16px;box-shadow:0 1px 4px var(--color-shadow);overflow:hidden;border:1px solid var(--color-border)}
.today-header{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;cursor:pointer;user-select:none;border:0;border-bottom:1px solid transparent;background:transparent;color:inherit;text-align:left}
.today-header:hover{background:var(--color-bg)}
.today-header.open{border-bottom-color:var(--color-border)}
.today-heading{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.today-count{font-size:13px;color:var(--color-text-muted);font-weight:400}
.today-header .arrow{transition:transform .2s;font-size:12px}
.today-header.open .arrow{transform:rotate(90deg)}
.today-body{display:none;padding:18px 24px}
.today-body.open{display:block}
.today-info{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;font-size:14px}
.hemi-btn{padding:5px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-primary);background:transparent;color:var(--color-primary-dark);cursor:pointer;font-size:13px;font-weight:500;transition:background-color .2s,color .2s}
.hemi-btn.active{background:var(--color-primary);color:#fff}
.today-group-header{font-size:14px;margin:12px 0 4px;padding:0;border:0;background:transparent;color:var(--color-primary-dark);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-weight:700}
.today-group-header:hover{color:var(--color-primary)}
.today-group-header .arrow{transition:transform .2s;font-size:11px;display:inline-block}
.today-group-header.open .arrow{transform:rotate(90deg)}
.today-group-body{display:none;padding-left:4px}
.today-group-body.open{display:block}
.today-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;flex-wrap:wrap}

.filter-bar{background:var(--color-surface);border-radius:var(--radius-card);padding:18px 24px;margin-bottom:16px;box-shadow:0 1px 4px var(--color-shadow);border:1px solid var(--color-border)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:13px;font-weight:600;color:var(--color-text-muted);min-width:60px}
.filter-options{display:flex;flex-wrap:wrap;gap:5px}
.filter-btn{padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);cursor:pointer;font-size:13px;font-weight:500;transition:border-color .15s,background-color .15s,color .15s;white-space:nowrap}
.filter-btn:hover{border-color:var(--color-primary);background:rgba(139,195,74,.08)}
.filter-btn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.filter-btn.month-grid{width:36px;text-align:center;padding:6px 0}
/* Only mark the current month/hour when it is not the active selection: the
   active (green) style must win so the user can tell "selected" apart from
   "just happens to be now". Applies to both the month and hour grids. */
.filter-btn.is-now:not(.active){border-color:var(--color-accent-warm);box-shadow:0 0 0 1px var(--color-accent-warm)}
.filter-reset{padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-danger);background:transparent;color:var(--color-danger);cursor:pointer;font-size:13px;font-weight:500;transition:background-color .15s,color .15s}
.filter-reset:hover{background:var(--color-danger);color:#fff}
.filter-toggle-btn{display:none;width:100%;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--color-primary);background:var(--color-surface);color:var(--color-primary-dark);cursor:pointer;font-size:14px;font-weight:600}
.filter-panel{display:block}
@media(max-width:640px){
  .filter-toggle-btn{display:block}
  .filter-panel{display:none;padding-top:12px}
  .filter-panel.open{display:block}
  .navbar{padding:0 10px}
  .nav-tab{padding:7px 10px;font-size:12px}
  .nav-title{font-size:11px}
  .heat-cell{width:20px;height:18px;font-size:9px}
  .meta-row{flex-wrap:wrap;row-gap:4px}
  .list-header{flex-wrap:wrap;row-gap:6px}
  .list-header .data-btn{margin-left:0!important}
  .creature-item{padding:12px 12px}
  .storage-mode-note{flex-basis:100%;max-width:none}
}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(16px);background:var(--color-text);color:var(--color-bg);padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;max-width:calc(100vw - 40px);text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-action{border:none;background:rgba(255,255,255,.18);color:#fff;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;flex-shrink:0;font-family:inherit;transition:background .15s}
.toast-action:hover{background:rgba(255,255,255,.32)}

.modal-overlay{position:fixed;inset:0;background:rgba(60,52,42,.4);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;transition:opacity .2s}
.modal-overlay.show{opacity:1}
.modal{background:var(--color-surface);border-radius:var(--radius-card);padding:22px 24px;max-width:340px;width:calc(100vw - 48px);box-shadow:0 10px 36px rgba(0,0,0,.2);border:1px solid var(--color-border)}
.modal-msg{font-size:14px;line-height:1.6;margin-bottom:18px;color:var(--color-text)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);cursor:pointer;font-size:13px;font-weight:500;transition:border-color .15s,background-color .15s,color .15s}
.modal-btn:hover{border-color:var(--color-primary)}
.modal-btn-confirm{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.modal-btn-confirm:hover{background:var(--color-primary-dark);border-color:var(--color-primary-dark);color:#fff}

.today-toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-muted);cursor:pointer;user-select:none}
.today-toggle input{accent-color:var(--color-primary);cursor:pointer}

.list-section{background:var(--color-surface);border-radius:var(--radius-card);overflow:hidden;box-shadow:0 1px 4px var(--color-shadow);border:1px solid var(--color-border)}
.list-header{display:flex;align-items:center;padding:12px 20px;border-bottom:2px solid var(--color-border);font-size:13px;font-weight:600;color:var(--color-text-muted);gap:8px;background:rgba(139,195,74,.04)}
.sort-btn{padding:4px 6px;border:0;border-radius:6px;background:transparent;color:var(--color-text-muted);cursor:pointer;font-size:13px;font-weight:600;transition:background-color .15s,color .15s}
.sort-btn:hover,.sort-btn[aria-pressed="true"]{color:var(--color-primary-dark);background:rgba(139,195,74,.08)}
.creature-item{display:grid;grid-template-columns:32px 1fr auto;align-items:start;padding:14px 20px;border-bottom:1px solid var(--color-border);transition:opacity .3s,background .2s;gap:8px 12px;cursor:pointer}
.creature-item:hover{background:rgba(139,195,74,.04)}
.creature-item.collected{opacity:.5;background:rgba(106,159,51,.04)}
.creature-item.collected .check-box{background:var(--color-collected);border-color:var(--color-collected)}
.creature-item.collected .check-box::after{opacity:1}
.creature-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.creature-name{font-weight:600;font-size:15px;white-space:nowrap}
.tag{padding:3px 10px;border-radius:12px;font-size:12px;white-space:nowrap;font-weight:500}
.tag-location{background:rgba(123,196,127,.18);color:#4A7C4F}
.tag-shadow{background:rgba(212,155,90,.18);color:#8B6914}
.tag-weather{background:rgba(123,160,196,.2);color:#3F6280}
.tag-leaving{background:rgba(232,149,111,.22);color:#A64B2A}
.tag-price{color:var(--color-text-muted);font-weight:700;font-size:13px;white-space:nowrap}
.note{font-size:12px;color:var(--color-text-muted);font-style:italic}
.check-box{width:28px;height:28px;border-radius:8px;border:2px solid var(--color-border);display:flex;align-items:center;justify-content:center;transition:background-color .25s,border-color .25s;flex-shrink:0;margin-top:2px}
.check-box::after{content:'\2713';color:#fff;font-size:16px;opacity:0;transition:opacity .2s;font-weight:700}
.creature-meta{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.meta-row{font-size:11px;color:var(--color-text-muted);display:flex;align-items:center;gap:2px}
.meta-label{min-width:40px;font-size:11px}
.meta-hours{font-size:12px;color:var(--color-text)}
.heat-cell{width:24px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-size:10px;background:var(--color-bg);color:var(--color-text-muted);transition:background-color .15s,color .15s,border-color .15s;font-weight:500}
.heat-cell.on{background:var(--color-primary);color:#fff}
.heat-cell.current{border:2px solid var(--color-accent-warm);box-shadow:0 0 0 1px var(--color-accent-warm)}
.empty-state{padding:48px;text-align:center;color:var(--color-text-muted);font-size:15px}
@media(hover:hover){button:active,.creature-item:active{transform:translateY(1px)}}
</style>
</head>
<body>

<nav class="navbar" aria-label="生物类别">
  <div class="nav-left">
    <span class="nav-title">ACNH Tracker</span>
  </div>
  <div class="nav-tabs" id="navTabs" role="group" aria-label="选择生物类别"></div>
</nav>

<main class="main">
  <div class="progress-section" id="progressSection" aria-live="polite"></div>
  <div class="data-bar" id="dataBar"></div>
  <div class="today-panel" id="todayPanel"></div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="list-section" id="listSection"></div>
</main>

<script src="bundle.js" defer></script>
</body>
</html>
